# ============================================================
# lm-eval-ledger - config template
# ============================================================
# Every available field, with explanation and examples. Copy this
# file, edit the copy, run it (naming the copy bench.yaml lets
# `lm-eval-ledger` pick it up with no -c flag):
#
#   cp template.yaml bench.yaml && lm-eval-ledger

# The resolved config of every run is stored in the ledger's runs table.
# Download it from the web app to reproduce the benchmark run exactly.

# Layout: sections 1-4 apply to every run. Section 5 is grouped by
# backend - keep the block for the backend you use, delete the rest
# (settings for other backends are simply ignored, so leftovers are
# harmless, just noise).

# ════════════════════════════════════════════════════════════
# 1. WHAT TO EVALUATE
# ════════════════════════════════════════════════════════════

# ── Models ──────────────────────────────────────────────────
# Run sequentially. Names: HF id, local checkpoint path, or
# "verl:<run_dir>" (expands to every checkpoint). With backend: server,
# the name is what the server reports at /v1/models (single-model
# servers like llama-server ignore it for routing, but it becomes the
# ledger's model_tag - use the real artifact name, or --alias).
#
# An entry is a plain name, or a mapping {name: ..., <overrides>} that
# replaces global settings for that model only. Allowed overrides:
#   chat_template_kwargs, backend, server_url, api_key, server_extra_body,
#   server_concurrency, request_timeout, quantization, apply_chat_template
# Sampling stays global on purpose - models in one run stay comparable.
# Overrides are also how one run mixes thinking modes or backends
# (e.g. a local vllm model + a remote API model, or on multi-GPU).
models:
  - Qwen/Qwen2.5-7B-Instruct                # plain: global settings
  # - name: Qwen/Qwen3-8B                   # thinking ON for this model only
  #   chat_template_kwargs: {enable_thinking: true}
  # - name: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL   # served over an API
  #   backend: server
  #   server_url: http://localhost:8080/v1
  # - /path/to/local/checkpoint
  # - verl:/path/to/verl-run                # overrides reach every checkpoint

# ── Tasks ───────────────────────────────────────────────────
# Full list with few-shot support and sample counts: configs/TASKS.md
# Forms:
#   "name"            task-default few-shot count
#   "name:4"          explicit few-shot count
#   "name:0,4,8"      few-shot ladder (three separate benchmarks)
#   {name: gsm8k_main, fewshot: [0, 8]}   mapping form of the same
# Empty list = run EVERY registered task at its defaults.
# MCQ tasks come in three eval modes (suffixes): _generate (free-form +
# \boxed{} extraction), _logprob_token (first-token log-probability),
# _logprob_seq (completion log-likelihood; vllm/hf backends only).
tasks:
  - gsm8k_main:0
  - gpqa_diamond_generate:0
  # - {name: mmlu_pro_generate, fewshot: [0, 4]}

# max_examples: cap per task - small number for smoke tests, null = all.
max_examples: 20

# batch_size: split generation into chunks of this many prompts.
#   null (default) = one engine call per task - best vllm/sglang
#   throughput, but their samples reach the ledger only at task end.
#   Set a number to (a) relieve OOM and (b) stream samples to the
#   ledger per chunk (watch them arrive in the viewer mid-task).
#   The server and hf backends stream per-request/batch regardless.
batch_size: null

# modality: image-bearing questions (HLE, TheoremQA).
#   text (default) = drop them: classic text-only scores.
#   all = send images too - needs a vision-capable model on
#   backend: server + apply_chat_template: true; other backends record
#   a clear per-task error. Images are stored deduplicated in the
#   ledger and shown in the viewer.
modality: text

# ════════════════════════════════════════════════════════════
# 2. PROMPTING
# ════════════════════════════════════════════════════════════

# apply_chat_template: wrap prompts in the model's chat template.
#   true for instruct/chat models, false for base models.
#   In-process backends render the template client-side; the server
#   backend sends messages to /chat/completions (server-side template).
#   Chat mode relies on EOS to end responses (task stop strings apply
#   only to base-model completion mode).
apply_chat_template: true

# chat_template_kwargs: extra chat-template kwargs - the thinking-mode
# control. Model-family specific; write what your model's template
# defines, and the run records exactly what was sent:
#   Qwen3 family:  {enable_thinking: false}
#                  {enable_thinking: true, reasoning_effort: high}
#   Granite:       {thinking: true}
# Leave UNSET and launch from a terminal to be prompted per model (the
# harness reads each template, offers its knobs as a menu, and prints
# the YAML to make it permanent). {} = template defaults, no menu.
# Per-model values belong on the model entry (see section 1).
chat_template_kwargs: {}

# ════════════════════════════════════════════════════════════
# 3. SAMPLING
# ════════════════════════════════════════════════════════════

temperature: 0.6    # 0 = greedy/deterministic. Thinking models NEED
                    # sampling (Qwen3: 0.6) - greedy can loop; check
                    # the model card.
top_p: 0.95
max_tokens: 2048    # generation budget per response. Thinking modes
                    # want 8192+; LiveCodeBench >= 2048. Truncations
                    # show up as "length" in stop_reason_counts.
pass_k: 1           # responses per sample; a sample scores its BEST
                    # response (pass@k). >1 needs temperature > 0.
seed: 42            # sampling seed (per-request seeds derive from it)

# ════════════════════════════════════════════════════════════
# 4. OUTPUT & VERIFICATION
# ════════════════════════════════════════════════════════════

# Relative paths resolve against the directory you run from; use
# absolute paths so runs land in the same place from anywhere.
results_dir: results         # run artifacts
logs_dir: logs               # tee'd stdout/stderr per run
data_dir: data               # optional local few-shot files
# db_path: THE ledger - one SQLite file all runs append to, powering
# `lm-eval-ledger runs/compare/serve`. null = <results_dir>/ledger.sqlite3
db_path: null
#   db_path: /abs/path/to/ledger.sqlite3

# LLM answer verification (optional post-run pass): re-judge stored
# responses with a verifier model - recovers answers that ignored the
# \boxed{} format. Writes verified_accuracy ALONGSIDE accuracy;
# originals are never overwritten. Also retroactive on any run:
#   lm-eval-ledger-verify results/ledger.sqlite3 --run 3
# The verifier is prefetched at run START (a bad name fails in minute
# one) and loads only after the eval model unloads.
verifier_model: null         # e.g. opencompass/CompassVerifier-7B
verifier_mode: fallback      # fallback = re-judge only string-match
                             # failures (either pipeline accepting the
                             # sample counts); all = verifier decides
verifier_max_model_len: 16384

# ════════════════════════════════════════════════════════════
# 5. INFERENCE BACKEND - pick one block, delete the rest
# ════════════════════════════════════════════════════════════
# backend selects the engine; each block below lists the settings that
# engine reads. Settings from other blocks are ignored (not an error).
# Per-model backend overrides (section 1) let one run mix backends.

backend: vllm       # vllm | hf | sglang | server
                    # Windows: server and hf are native; vllm/sglang
                    # are Linux-only (no Windows wheels upstream)

# ── backend: vllm ───────────────────────────────────────────
# In-process, fastest, all eval modes. pip install lm-eval-ledger[vllm]
gpu_memory_utilization: 0.90 # fraction of VRAM the engine may claim
max_model_len: 4096          # context window (prompt + generation).
                             # null = model default. Prompts exceeding
                             # (max_model_len - max_tokens) are skipped
                             # with a warning; long-context tasks
                             # (mrcr_*) need 32k+.
enforce_eager: true          # disable CUDA graphs: slower decode, less
                             # VRAM; false is fine for long runs
gpu_ids: null                # null = default GPU; [3] = pin to GPU 3;
                             # [0, 1, 2] = one worker per GPU, models
                             # distributed round-robin, one ledger
# quantization: on-the-fly quantization (also honored by hf).
#   null = native precision; a string for all models ("bitsandbytes" /
#   "awq" / "gptq" / "fp8"); or a {model_tag: method} mapping.
quantization: null
#   quantization: {Qwen3-14B: bitsandbytes}

# ── backend: hf ─────────────────────────────────────────────
# transformers + accelerate; every architecture, all eval modes, slow -
# the compatibility backend. pip install lm-eval-ledger[hf]
# Reads: max_model_len, gpu_ids, quantization (bitsandbytes) above.

# ── backend: sglang ─────────────────────────────────────────
# In-process sglang.Engine; generate + logprob_token.
# pip install lm-eval-ledger[sglang]
# Reads: gpu_memory_utilization, max_model_len, gpu_ids above.

# ── backend: server ─────────────────────────────────────────
# Any OpenAI-compatible endpoint: llama.cpp llama-server, ollama,
# LM Studio, remote vllm/sglang, hosted APIs. No extra install.
# generate + logprob_token (server-dependent). The server owns model
# loading, context size, and quantization.
# llama-server example (16k context per slot, template kwargs enabled):
#   llama-server -hf <repo:quant> -ngl 999 -c 65536 -np 4 --jinja
server_url: http://localhost:8080/v1   # the endpoint's /v1 base
api_key: null                # bearer token, for endpoints that need one
server_concurrency: 8        # in-flight requests; = llama-server -np
request_timeout: 600         # seconds per request: thinking modes can
                             # legitimately take minutes
# server_extra_body: extra JSON merged into every request body, for
# server-specific knobs outside the OpenAI schema:
server_extra_body: null
#   e.g.  server_extra_body: {top_k: 20}
