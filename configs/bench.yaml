# bench.yaml - benchmark run configuration
#
# Usage:
#   python run_bench.py                       # uses this file
#   python run_bench.py -c other.yaml         # a different config
#   python run_bench.py --max-examples 10     # any CLI flag overrides this file
#
# Unknown keys are rejected (typos fail loudly). See config.py for all fields
# and their defaults; the resolved config for every run is saved to
# results/{run_name}_config.yaml and into the run's SQLite DB.

# ── Models ────────────────────────────────────────────────
# HuggingFace ids or local paths, run sequentially.
# "verl:<run_dir>" expands to every global_step checkpoint in a veRL run, e.g.:
#   - verl:/mnt/data8tb/Documents/project/rlvr_winter/verl-my-rlvr/finished-models/grpo-gsm8k-train-13ep-success
