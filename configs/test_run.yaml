# test_run.yaml - smoke test: 5 ~10B instruct models, recent tasks included.
#
# All five models are ALREADY in the HF hub cache (no model downloads).
# 10 examples per task keeps the run short; drop max_examples to null for
# real numbers.

models:
  - Qwen/Qwen2.5-7B-Instruct
  - Qwen/Qwen2-7B-Instruct
  - Qwen/Qwen3-8B                          # hybrid thinking model; may hit max_tokens
  - Qwen/Qwen3.5-9B
  - Qwen/Qwen3-14B                         # runs 4-bit via the quantization map below

tasks:
  - gsm8k_main:0
  - gpqa_diamond_generate:0     # gated dataset (you have access)
  - hle:0                       # NEW - gated dataset (you have access)
  - livecodebench:0             # NEW - executes generated code locally
  - mrcr_2needle:0              # NEW - long context; over-budget prompts are skipped

max_examples: 20                # per task; smoke-test size
batch_size: null

apply_chat_template: true       # all five are instruct models

temperature: 0.0
top_p: 0.95
max_tokens: 2048                # livecodebench wants >= 2048
pass_k: 1
seed: 42

# Pin the ledger location so runs land in the same DB regardless of the
# directory the command is run from (default would be ./results/ledger.sqlite3).
db_path: /mnt/data8tb/Documents/project/lm-eval-ledger/results/ledger.sqlite3

gpu_memory_utilization: 0.90
max_model_len: 16384            # lets some MRCR examples fit; 8B fp16 + 16k fits 32GB
enforce_eager: true
gpu_ids: null                   # single GPU

quantization:
  Qwen3-14B: bitsandbytes       # 14B fp16 wouldn't fit 32GB; others run fp16

# Post-run LLM verification (NEW): re-judges string-match failures.
# Downloads CompassVerifier-7B (~15GB) on first use. Comment out to skip.
verifier_model: opencompass/CompassVerifier-7B
verifier_mode: fallback
