# llamacpp_big.yaml - overnight full benchmark of the llama.cpp-served
# Qwen3.8-27B Q4 quant. Six generate-mode tasks, full example counts.
#
#   .venv/bin/lm-eval-ledger -c configs/llamacpp_big.yaml

backend: server
server_url: http://localhost:8080/v1
server_concurrency: 4          # matches the server's -np slots
request_timeout: 900           # 27B quant + 3k tokens can be slow per request

models:
  - unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL

# Cheapest first so results land early; MMLU-Pro (~12k examples, the
# long pole) runs last. MRCR excluded: the server's 8192-token slots
# can't fit its prompts (long-context needs the vllm backend).
tasks:
  - gpqa_diamond_generate:0    # 198
  - hle:0                      # 2158
  - livecodebench:0            # 1055; executes generated code locally
  - mmlu_pro_generate:0        # 12032

max_examples: null             # FULL
batch_size: null

apply_chat_template: true

temperature: 0.0
top_p: 0.95
max_tokens: 3072               # slot ctx is 8192; leave room for prompts
pass_k: 1
seed: 42

db_path: /mnt/data8tb/Documents/project/lm-eval-ledger/results/ledger-2.sqlite3

gpu_ids: null
quantization: null
# no verifier: the GPU is occupied by the llama.cpp server
