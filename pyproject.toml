[project]
name = "lm-eval-ledger"
version = "0.1.0"
description = "vLLM-based LLM benchmark harness that records every prompt, response, and score to SQLite"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jaymin Bhan", email = "jayminbhan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23",
    "httpx>=0.27",
    "flask>=3.0",
    "latex2sympy2_extended==1.0.6",
]

keywords = ["llm", "evaluation", "benchmark", "vllm", "eval-harness"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# vllm/sglang publish Linux-only wheels; the platform markers keep
# `pip install lm-eval-ledger[vllm]` (and [all]) resolvable on Windows
# by skipping them there - the harness explains at runtime instead.
# Windows-supported routes: base install (server backend) and [hf].
vllm = ["vllm>=0.28; sys_platform == 'linux'",
        "bitsandbytes>=0.45; sys_platform == 'linux'"]
hf = ["torch>=2.4", "transformers>=4.48", "accelerate>=1.2"]
sglang = ["sglang>=0.4; sys_platform == 'linux'"]
all = [
    "vllm>=0.28; sys_platform == 'linux'",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
    "torch>=2.4", "transformers>=4.48", "accelerate>=1.2",
    "sglang>=0.4; sys_platform == 'linux'",
]

[project.scripts]
lm-eval-ledger = "lm_eval_ledger.cli:main"
lm-eval-ledger-verify = "lm_eval_ledger.verifier:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
