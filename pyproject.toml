[project]
name = "lm-eval-ledger"
version = "0.1.0"
description = "vLLM-based LLM benchmark harness that records every prompt, response, and score to SQLite"
readme = "README.md"
authors = [
    { name = "Jaymin Bhan", email = "jayminbhan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23",
    "datasette>=0.65.3",
    "httpx>=0.27",
    "flask>=3.0",
]

keywords = ["llm", "evaluation", "benchmark", "vllm", "eval-harness"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
vllm = ["vllm>=0.28", "bitsandbytes>=0.45"]
hf = ["torch>=2.4", "transformers>=4.48", "accelerate>=1.2"]
sglang = ["sglang>=0.4"]
all = [
    "vllm>=0.28", "bitsandbytes>=0.45",
    "torch>=2.4", "transformers>=4.48", "accelerate>=1.2",
    "sglang>=0.4",
]

[project.scripts]
lm-eval-ledger = "lm_eval_ledger.cli:main"
lm-eval-ledger-verify = "lm_eval_ledger.verifier:main"

[project.entry-points.datasette]
lm_eval_ledger = "lm_eval_ledger.datasette_plugin"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
